# Publishes the website to GitHub Pages every time you push to the main branch.
# It runs the tests first (a broken change is never published), then builds the static site
# (scripts/build_static.py: the physics runs in the visitor's browser) and puts it online.
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions" (see docs/DEPLOY.md).
name: Publish the website

on:
  push:
    branches: [main]
  workflow_dispatch:        # also a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the tests
        run: uv run pytest -q
      - name: Build the static site
        run: uv run python scripts/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
