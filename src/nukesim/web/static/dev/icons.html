<!doctype html><html><head><meta charset="utf-8"><base href="/"><link rel="stylesheet" href="style.css">
<style>body{background:#f4f7fb;padding:20px;font-family:system-ui;color:#232846} .g{display:grid;grid-template-columns:repeat(auto-fill,110px);gap:10px}
.c{background:#fff;border-radius:12px;padding:10px;text-align:center;font-size:12px} .c .ic{width:48px;height:48px;display:block;margin:4px auto 6px;color:#2c5f8a}
.d{background:#0f1720;color:#dfe9f2} .d .ic{color:#fff} canvas{display:block;margin:auto}</style></head><body>
<div class="g" id="g"></div><h3>small, in text</h3><p id="t" style="font-size:16px"></p><h3>pins</h3><div id="p"></div>
<script type="module">
import { ICONS, icon, drawIcon } from "./icons.js";
const g = document.getElementById("g");
for (const k of Object.keys(ICONS)) g.insertAdjacentHTML("beforeend", `<div class="c">${icon(k)}${k}</div>`);
document.getElementById("t").innerHTML = Object.keys(ICONS).map((k) => icon(k) + " " + k).join(" &nbsp; ");
for (const k of ["fish","dolphin","whale","shark","seal","turtle","bird","diver","speedboat","fishingboat","ship","carrier"]) {
  const c = document.createElement("canvas"); c.width = c.height = 64; c.style.display = "inline-block";
  const x = c.getContext("2d"); x.beginPath(); x.arc(32,32,27,0,7); x.fillStyle="rgba(15,23,32,.75)"; x.fill(); x.lineWidth=4; x.strokeStyle="#e0862a"; x.stroke();
  drawIcon(x, k, 32, 33, 34); document.getElementById("p").appendChild(c);
}
</script></body></html>
